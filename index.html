    <!-- Logo intro: pure HTML/CSS so it shows instantly while the site loads. Ivory so the logo shows in its true colours. -->
    <style>
      html, body { background: #0f1b33; }
      #intro { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at center, #fdf9ef 0%, #f3ead6 75%); transition: opacity .8s cubic-bezier(.22,1,.36,1), visibility .8s; }
      #intro.intro-done { opacity: 0; visibility: hidden; }
      #intro .intro-logo { width: 240px; height: auto; margin: -48px 0 -34px; mix-blend-mode: multiply; opacity: 0; transform: translateY(16px) scale(.94); animation: introLogo 1.2s cubic-bezier(.22,1,.36,1) .1s forwards; }
      #intro .intro-stars { display: flex; gap: 8px; color: #b8933a; font-size: 18px; line-height: 1; }
      #intro .intro-stars span { opacity: 0; transform: scale(.4); animation: introStar .5s cubic-bezier(.22,1,.36,1) forwards; }
      #intro .intro-stars span:nth-child(1) { animation-delay: .5s; }
      #intro .intro-stars span:nth-child(2) { animation-delay: .6s; }
      #intro .intro-stars span:nth-child(3) { animation-delay: .7s; }
      #intro .intro-stars span:nth-child(4) { animation-delay: .8s; }
      #intro .intro-stars span:nth-child(5) { animation-delay: .9s; }
      #intro .intro-title { font: 500 12px/1 Geist, system-ui, sans-serif; letter-spacing: .5em; text-transform: uppercase; color: #1b2540; opacity: 0; animation: introFade .9s ease 1s forwards; }
      #intro .intro-line { display: block; height: 1px; width: 160px; background: linear-gradient(90deg, transparent, #b8933a, transparent); transform: scaleX(0); animation: introLine 1.2s cubic-bezier(.22,1,.36,1) 1.05s forwards; }
      #intro .intro-text { font: 400 10px/1 Geist, system-ui, sans-serif; letter-spacing: .45em; text-transform: uppercase; color: #8a6a22; opacity: 0; animation: introFade .9s ease 1.2s forwards; }
      @keyframes introLogo { to { opacity: 1; transform: none; } }
      @keyframes introStar { to { opacity: 1; transform: none; } }
      @keyframes introLine { to { transform: scaleX(1); } }
      @keyframes introFade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #intro * { animation-duration: .01s !important; animation-delay: 0s !important; } }
    </style>
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <img class="intro-logo" src="https://hercules-cdn.com/cdn-cgi/image/w=480,quality=85,fit=scale-down,format=auto/file_In72XlrUsnNamC72DdnGy1s0" alt="" width="240" height="240" fetchpriority="high" />
      <span class="intro-stars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></span>
      <span class="intro-title">Five Star Hotel</span>
      <span class="intro-line"></span>
      <span class="intro-text">Rajkot &middot; Since 2004</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
